<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <title>Project Buddy</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap');

    :root {
      color-scheme: light dark;
      --bg: #f4f6f1;
      --surface: #ffffff;
      --sidebar: #18231e;
      --sidebar-2: #223129;
      --ink: #17211c;
      --muted: #5b6861;
      --line: #d9ded8;
      --line-strong: #c1c9c1;
      --accent: #c5502e;
      --accent-soft: #fae6dd;
      --green: #2f7a52;
      --gold: #9c6b11;
      --blue: #306b8b;
      --shadow: 0 18px 45px rgba(27, 41, 33, .1);
      --radius: 14px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111713;
        --surface: #18201b;
        --sidebar: #0d130f;
        --sidebar-2: #18221b;
        --ink: #edf3ee;
        --muted: #aab7ae;
        --line: #303b33;
        --line-strong: #465348;
        --accent: #ed7955;
        --accent-soft: #42271f;
        --green: #67b889;
        --gold: #d4a24e;
        --blue: #70a9c7;
        --shadow: 0 18px 45px rgba(0, 0, 0, .28);
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Manrope", sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 296px minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--sidebar);
      color: #f2f7f3;
      border-right: 1px solid rgba(255,255,255,.08);
      z-index: 20;
    }
    .sidebar-head { padding: 24px 18px 14px; }
    .sidebar-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }
    .sidebar-label strong { font-size: 17px; letter-spacing: -.02em; }
    .count {
      min-width: 28px;
      padding: 2px 8px;
      border-radius: 99px;
      background: rgba(255,255,255,.1);
      color: #cad6ce;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      text-align: center;
    }
    .search-wrap { position: relative; }
    .search-wrap svg {
      position: absolute;
      left: 11px;
      top: 50%;
      width: 16px;
      transform: translateY(-50%);
      color: #91a197;
      pointer-events: none;
    }
    #buddySearch {
      width: 100%;
      height: 40px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 9px;
      outline: none;
      background: rgba(255,255,255,.07);
      color: #fff;
      padding: 0 12px 0 36px;
    }
    #buddySearch::placeholder { color: #91a197; }
    #buddySearch:focus { border-color: rgba(255,255,255,.38); }

    .buddy-nav {
      flex: 1;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 3px 10px 28px;
      scrollbar-width: thin;
      scrollbar-color: #425247 transparent;
    }
    .nav-group-title {
      margin: 17px 10px 6px;
      color: #829187;
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .buddy-link {
      width: 100%;
      display: grid;
      grid-template-columns: 9px minmax(0,1fr) auto;
      align-items: center;
      gap: 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      padding: 9px 10px 9px calc(10px + var(--nav-depth, 0) * 12px);
      cursor: pointer;
      text-align: left;
    }
    .buddy-link:hover { background: rgba(255,255,255,.065); }
    .buddy-link[aria-current="page"] { background: var(--sidebar-2); }
    .buddy-link[aria-current="page"] .buddy-name { color: #fff; font-weight: 650; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dot, #a7b3ab); }
    .buddy-label { min-width: 0; display: grid; }
    .buddy-name { color: #d7e0da; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .buddy-canonical { color: #829187; font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .buddy-stage-mini {
      color: #829187;
      font-family: "IBM Plex Mono", monospace;
      font-size: 9px;
    }
    .empty-filter { padding: 24px 10px; color: #91a197; font-size: 13px; }

    .main { min-width: 0; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 clamp(20px, 4vw, 60px);
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(12px);
    }
    .crumb { min-width: 0; color: var(--muted); font-size: 13px; }
    .crumb strong { color: var(--ink); font-weight: 650; }
    .updated { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 11px; white-space: nowrap; }
    .menu-btn {
      display: none;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
      cursor: pointer;
    }

    .content {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 52px clamp(20px, 5vw, 68px) 80px;
    }
    .buddy-header {
      display: grid;
      grid-template-columns: minmax(0,1fr) auto;
      gap: 32px;
      align-items: end;
      padding-bottom: 34px;
      border-bottom: 1px solid var(--line-strong);
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 12px;
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
    }
    .eyebrow .dot { width: 8px; height: 8px; }
    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(38px, 6vw, 66px);
      line-height: .98;
      letter-spacing: -.055em;
    }
    .summary {
      max-width: 720px;
      margin: 20px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 20px);
      line-height: 1.55;
      letter-spacing: -.012em;
    }
    .status-stamp {
      min-width: 132px;
      padding: 15px 17px;
      border-top: 3px solid var(--accent);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .status-stamp span { display: block; color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
    .status-stamp strong { display: block; margin-top: 4px; font-size: 14px; }

    .section-tabs {
      position: sticky;
      top: 62px;
      z-index: 8;
      display: flex;
      gap: 2px;
      margin: 0 -8px;
      padding: 14px 8px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .section-tabs a {
      border-radius: 7px;
      padding: 8px 11px;
      color: var(--muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
    }
    .section-tabs a:hover, .section-tabs a:focus-visible { color: var(--ink); background: var(--surface); }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-top: 36px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .fact { min-width: 0; padding: 23px 24px 24px 0; }
    .fact + .fact { border-left: 1px solid var(--line); padding-left: 24px; }
    .fact-label { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
    .fact-value { margin-top: 7px; font-weight: 650; line-height: 1.35; overflow-wrap: anywhere; }

    .page-section { scroll-margin-top: 126px; padding: 54px 0 0; }
    .collapsible-header {
      width: 100%;
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr) auto;
      gap: 34px;
      align-items: start;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      text-align: left;
    }
    .collapsible-header h2 { margin: 0; font-size: 14px; letter-spacing: -.01em; }
    .collapsible-header p { margin: 0; max-width: 680px; color: var(--muted); font-size: 17px; }
    .collapsible-chevron { color: var(--muted); font-size: 18px; line-height: 1; transition: transform .15s ease; }
    .collapsible-header[aria-expanded="true"] .collapsible-chevron { transform: rotate(90deg); }
    .collapsible-header:focus-visible { outline: 2px solid var(--accent); outline-offset: 7px; border-radius: 2px; }
    .collapsible-body[hidden] { display: none; }
    .overview-section { scroll-margin-top: 126px; padding-top: 22px; }
    .overview-section .collapsible-header { padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .overview-section .collapsible-body .overview-grid { margin-top: 0; border-top: 0; }
    .section-heading { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 34px; }
    .section-heading h2 { margin: 0; font-size: 14px; letter-spacing: -.01em; }
    .section-heading p { margin: 0; max-width: 680px; color: var(--muted); font-size: 17px; }

    .focus-list { margin: 28px 0 0 214px; border-top: 1px solid var(--line); }
    .focus-item {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 16px;
      padding: 21px 0;
      border-bottom: 1px solid var(--line);
    }
    .focus-number { color: var(--accent); font-family: "IBM Plex Mono", monospace; font-size: 11px; padding-top: 3px; }
    .focus-item h3 { margin: 0 0 5px; font-size: 16px; }
    .focus-item p { margin: 0; color: var(--muted); }

    .next-card {
      margin: 30px 0 0 214px;
      display: grid;
      grid-template-columns: 7px minmax(0,1fr);
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .next-accent { background: var(--accent); }
    .next-body { padding: 26px 28px; }
    .next-body span { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .07em; }
    .next-body p { margin: 8px 0 0; font-size: 18px; font-weight: 600; line-height: 1.45; }

    .related-wrap { margin: 24px 0 0 214px; display: flex; flex-wrap: wrap; gap: 8px; }
    .related-btn {
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: transparent;
      padding: 8px 11px;
      cursor: pointer;
      font-size: 13px;
    }
    .related-btn:hover { border-color: var(--accent); color: var(--accent); }
    .none { color: var(--muted); font-size: 13px; }

    .directory-home { padding-top: 34px; }
    .directory-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }
    .directory-summary { color: var(--muted); font-size: 13px; }
    .view-switch {
      display: inline-grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
    }
    .view-btn {
      min-width: 92px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      padding: 8px 12px;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
    }
    .view-btn[aria-pressed="true"] { background: var(--sidebar); color: #f2f7f3; }
    .view-btn:focus-visible, .tree-node:focus-visible, .outline-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .directory-workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 62px;
      gap: 16px;
      align-items: start;
      margin-top: 18px;
    }
    .directory-viewport {
      min-width: 0;
      max-height: clamp(420px, 68vh, 760px);
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--line-strong) transparent;
    }
    .directory-panel {
      padding-top: 8px;
      transform-origin: top left;
    }
    .directory-panel[hidden] { display: none; }
    .zoom-dock {
      position: sticky;
      top: 142px;
      z-index: 7;
      width: 62px;
      display: grid;
      justify-items: center;
      gap: 8px;
      padding: 10px 6px 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(27, 41, 33, .08);
    }
    .zoom-label {
      color: var(--muted);
      font-family: "IBM Plex Mono", monospace;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .zoom-slider {
      width: 24px;
      height: 112px;
      margin: 0;
      writing-mode: vertical-lr;
      direction: rtl;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .zoom-value {
      min-width: 46px;
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      font-weight: 500;
      text-align: center;
    }
    .zoom-reset {
      width: 46px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: transparent;
      padding: 5px 3px;
      color: var(--muted);
      cursor: pointer;
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      font-weight: 500;
    }
    .zoom-reset:hover { border-color: var(--accent); color: var(--accent); }
    .zoom-slider:focus-visible, .zoom-reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .org-chart { padding: 6px 0 10px; }
    .org-chart ul {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 22px 12px;
      margin: 0;
      padding: 28px 0 0;
      list-style: none;
    }
    .org-chart > ul { padding-top: 0; }
    .org-chart li {
      position: relative;
      flex: 0 1 190px;
      min-width: 150px;
      list-style: none;
    }
    .org-chart > ul > li, .org-chart li.org-branch-expanded { flex: 1 0 100%; }
    .org-chart li > ul::before {
      content: "";
      position: absolute;
      top: 0;
      left: 8%;
      right: 8%;
      border-top: 1px solid var(--line-strong);
    }
    .org-chart li > ul::after {
      content: "";
      position: absolute;
      top: -22px;
      left: 50%;
      height: 22px;
      border-left: 1px solid var(--line-strong);
    }
    .org-chart li > ul > li:not(.org-drop-slot)::before {
      content: "";
      position: absolute;
      top: -28px;
      left: 50%;
      height: 28px;
      border-left: 1px solid var(--line-strong);
    }
    .org-node {
      position: relative;
      width: min(210px, 100%);
      min-height: 78px;
      margin: 0 auto;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
      box-shadow: 0 7px 18px rgba(27, 41, 33, .06);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .org-node[draggable="true"] { cursor: grab; }
    .org-node.is-dragging { opacity: .45; cursor: grabbing; }
    .org-node.is-drop-target { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
    .org-toggle {
      width: 100%;
      min-height: 48px;
      display: grid;
      grid-template-columns: 9px minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      border: 0;
      background: transparent;
      padding: 11px 11px 7px;
      cursor: pointer;
      text-align: left;
    }
    .org-toggle:hover .org-node-name { color: var(--accent); }
    .org-node-label { min-width: 0; display: grid; }
    .org-node-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; font-size: 13px; }
    .org-node-canonical { color: var(--muted); font-size: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .org-detail-cue { color: var(--muted); font-size: 13px; }
    .org-node-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 8px 8px 11px; }
    .org-child-count { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 9px; }
    .org-node-actions { display: flex; align-items: center; gap: 5px; }
    .org-expand, .org-goto {
      border: 0;
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
    }
    .org-expand { background: transparent; color: var(--muted); }
    .org-expand:hover { background: var(--bg); color: var(--ink); }
    .org-goto { background: var(--accent-soft); color: var(--accent); }
    .org-goto:hover { filter: brightness(.97); }
    .org-toggle:focus-visible, .org-expand:focus-visible, .org-goto:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .org-drop-slot {
      flex: 0 0 10px;
      min-width: 10px;
      min-height: 78px;
      border-radius: 6px;
      transition: background .15s ease, box-shadow .15s ease;
    }
    .org-chart.is-dragging .org-drop-slot { background: color-mix(in srgb, var(--line-strong) 30%, transparent); }
    .org-drop-slot.is-drop-target { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
    .move-status {
      min-height: 22px;
      margin: 14px 0 0;
      color: var(--green);
      font-size: 12px;
      font-weight: 650;
    }
    .hierarchy-tree, .hierarchy-tree ul { margin: 0; padding: 0; list-style: none; }
    .hierarchy-tree ul {
      position: relative;
      margin-left: 25px;
      padding-left: 26px;
    }
    .hierarchy-tree ul::before {
      content: "";
      position: absolute;
      inset: 0 auto 15px 0;
      border-left: 1px solid var(--line-strong);
    }
    .hierarchy-tree li { position: relative; padding: 7px 0; }
    .hierarchy-tree ul > li::before {
      content: "";
      position: absolute;
      left: -26px;
      top: 27px;
      width: 26px;
      border-top: 1px solid var(--line-strong);
    }
    .tree-row { display: flex; align-items: center; gap: 9px; }
    .tree-node {
      min-width: 210px;
      max-width: min(430px, 100%);
      display: grid;
      grid-template-columns: 9px minmax(0,1fr) auto;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--surface);
      padding: 11px 12px;
      cursor: pointer;
      text-align: left;
    }
    .tree-node:hover { border-color: var(--line-strong); box-shadow: 0 5px 18px rgba(27, 41, 33, .07); }
    .tree-node-label { min-width: 0; display: grid; }
    .tree-node-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 650; }
    .tree-node-canonical { color: var(--muted); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tree-node-stage { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 9px; }
    .child-count { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 10px; }
    .outline-list { border-top: 1px solid var(--line-strong); }
    .outline-row {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(190px, 1fr) minmax(150px, .72fr) auto;
      gap: 20px;
      align-items: center;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      padding: 14px 10px 14px calc(10px + var(--depth, 0) * 24px);
      cursor: pointer;
      text-align: left;
    }
    .outline-row:hover { background: var(--surface); }
    .outline-name { display: flex; align-items: center; gap: 10px; min-width: 0; font-weight: 650; }
    .outline-name-text { min-width: 0; display: grid; }
    .outline-name-text > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .outline-canonical { color: var(--muted); font-size: 10px; font-weight: 500; }
    .canonical-title { margin-top: 8px; color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 11px; }
    .outline-parent { color: var(--muted); font-size: 12px; }
    .outline-stage { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 10px; text-align: right; }
    .directory-note { margin: 20px 0 0; color: var(--muted); font-size: 13px; }

    body.detail-open { overflow: hidden; }
    .detail-layer {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      grid-template-columns: minmax(0, 1fr) min(520px, 94vw);
    }
    .detail-layer[hidden] { display: none; }
    .detail-backdrop {
      grid-column: 1 / -1;
      grid-row: 1;
      border: 0;
      background: rgba(6, 12, 8, .5);
      cursor: default;
    }
    .detail-panel {
      position: relative;
      grid-column: 2;
      grid-row: 1;
      min-width: 0;
      height: 100%;
      overflow-y: auto;
      background: var(--surface);

    const groupOrder = ["Core", "Home & family", "Money", "Personal", "Work & making"];
    const nav = document.getElementById("buddyNav");
    const page = document.getElementById("buddyPage");
    const search = document.getElementById("buddySearch");
    const count = document.getElementById("buddyCount");
    const directoryMeta = document.getElementById("directoryMeta");
    const crumbName = document.getElementById("crumbName");
    const menuButton = document.getElementById("menuButton");
    const scrim = document.getElementById("scrim");
    let activeId = "project-buddy";
    let directoryView = "org";
    let directoryZoom = 100;
    const expandedOrg = new Set([...hierarchyRoots().map(buddy => buddy.id), "project-buddy"]);
    let draggedBuddyId = null;
    let dragJustEnded = false;
    let moveStatusTimer = null;
    let detailReturnFocus = null;

    function stageShort(stage) {
      const map = {"Brief review":"brief", "Build ready":"ready", "Direction set":"set", "Pilot design":"pilot", "PRD review":"prd", "PRD ready":"prd", "Hierarchy defined":"set"};
      return map[stage] || stage.toLowerCase().split(" ")[0];
    }

    function displayName(buddy) {
      return buddy.alias || buddy.name;
    }

    function canonicalNameMarkup(buddy, className) {
      return buddy.alias ? `<span class="${className}">${buddy.name}</span>` : "";
    }

    function sourceMarkup(buddy) {
      return buddy.brief
        ? `<a class="brief-link" href="${buddy.brief}" target="_blank" rel="noopener noreferrer">${buddy.source}</a>`
        : buddy.source;
    }

    function buddyDepth(buddy) {
      let depth = 0;
      let current = buddy;
      const seen = new Set();
      while (current && current.parent !== "—" && !seen.has(current.id)) {
        seen.add(current.id);
        const parent = buddies.find(candidate => candidate.name === current.parent);
        if (!parent) break;
        depth += 1;
        current = parent;
      }
      return depth;
    }

    function renderNav(filter = "") {
      const term = filter.trim().toLowerCase();
      const visible = buddies.filter(b => !term || [b.name, b.alias || "", b.group, b.parent, b.stage].join(" ").toLowerCase().includes(term));
      count.textContent = buddies.length;
      directoryMeta.textContent = `${buddies.length} buddies · One registry`;
      nav.innerHTML = "";
      if (!visible.length) {
        nav.innerHTML = '<div class="empty-filter">No buddy matches that search.</div>';
        return;
      }
      groupOrder.forEach(group => {
        const entries = visible.filter(b => b.group === group);
        if (!entries.length) return;
        const title = document.createElement("div");
        title.className = "nav-group-title";
        title.textContent = group;
        nav.appendChild(title);
        entries.forEach(buddy => {
          const button = document.createElement("button");
          button.className = "buddy-link";
          button.type = "button";
          button.dataset.id = buddy.id;
          button.style.setProperty("--nav-depth", buddyDepth(buddy));
          if (buddy.id === activeId) button.setAttribute("aria-current", "page");
          button.setAttribute("aria-label", buddy.alias ? `Open ${buddy.alias}, ${buddy.name}` : `Open ${buddy.name}`);
          button.innerHTML = `<span class="dot" style="--dot:${buddy.color}"></span><span class="buddy-label"><span class="buddy-name">${displayName(buddy)}</span>${canonicalNameMarkup(buddy, "buddy-canonical")}</span><span class="buddy-stage-mini">${stageShort(buddy.stage)}</span>`;
          button.addEventListener("click", () => selectBuddy(buddy.id, true));
          nav.appendChild(button);
        });
      });
    }

    function relatedButtons(ids) {
      if (!ids || !ids.length) return '<span class="none">No connected buddies yet.</span>';
      return ids.map(id => {
        const buddy = buddies.find(b => b.id === id);
        return buddy ? `<button class="related-btn" type="button" data-related="${buddy.id}">${displayName(buddy)}</button>` : "";
      }).join("");
    }

    function childrenOf(buddy) {
      return buddies.filter(candidate => candidate.parent === buddy.name);
    }

    function hierarchyRoots() {
      return buddies.filter(buddy => buddy.parent === "—" || !buddies.some(candidate => candidate.name === buddy.parent));
    }

    function treeBranch(buddy) {
      const children = childrenOf(buddy);
      return `
        <li role="treeitem"${children.length ? ' aria-expanded="true"' : ""}>
          <div class="tree-row">
            <button class="tree-node" type="button" data-preview-id="${buddy.id}" aria-label="${buddy.alias ? `View details for ${buddy.alias}, ${buddy.name}` : `View details for ${buddy.name}`}">
              <span class="dot" style="--dot:${buddy.color}"></span>
              <span class="tree-node-label"><span class="tree-node-name">${displayName(buddy)}</span>${canonicalNameMarkup(buddy, "tree-node-canonical")}</span>
              <span class="tree-node-stage">${stageShort(buddy.stage)}</span>
            </button>
            ${children.length ? `<span class="child-count">${children.length} ${children.length === 1 ? "child" : "children"}</span>` : ""}
          </div>
          ${children.length ? `<ul role="group">${children.map(treeBranch).join("")}</ul>` : ""}
        </li>`;
    }

    function flattenHierarchy() {
      const rows = [];
      function visit(buddy, depth) {
        rows.push({buddy, depth});
        childrenOf(buddy).forEach(child => visit(child, depth + 1));
      }
      hierarchyRoots().forEach(root => visit(root, 0));
      return rows;
    }

    function hierarchyDepth() {
      return flattenHierarchy().reduce((deepest, row) => Math.max(deepest, row.depth + 1), 1);
    }

    function orgDropSlot(parentId, beforeId) {
      return `<li class="org-drop-slot" role="none" data-drop-parent="${parentId}" data-drop-before="${beforeId || ""}" aria-hidden="true"></li>`;
    }

    function orgBranch(buddy) {
      const children = childrenOf(buddy);
      const isExpanded = children.length > 0 && expandedOrg.has(buddy.id);
      const childMarkup = children.map(child => `${orgDropSlot(buddy.id, child.id)}${orgBranch(child)}`).join("") + orgDropSlot(buddy.id, "");
      return `
        <li role="treeitem" class="${isExpanded ? "org-branch-expanded" : ""}"${children.length ? ` aria-expanded="${isExpanded}"` : ""}>
          <div class="org-node" data-org-node="${buddy.id}" ${buddy.parent === "—" ? "" : `draggable="true"`}>
            <button class="org-toggle" type="button" data-preview-id="${buddy.id}" aria-label="View details for ${displayName(buddy)}">
              <span class="dot" style="--dot:${buddy.color}"></span>
              <span class="org-node-label"><span class="org-node-name">${displayName(buddy)}</span>${canonicalNameMarkup(buddy, "org-node-canonical")}</span>
              <span class="org-detail-cue" aria-hidden="true">•••</span>
            </button>
            <div class="org-node-footer">
              <span class="org-child-count">${children.length ? `${children.length} ${children.length === 1 ? "child" : "children"}` : stageShort(buddy.stage)}</span>
              <span class="org-node-actions">
                ${children.length ? `<button class="org-expand" type="button" data-org-toggle="${buddy.id}" aria-expanded="${isExpanded}" aria-label="${isExpanded ? "Collapse" : "Expand"} children of ${displayName(buddy)}">${isExpanded ? "Collapse" : "Expand"}</button>` : ""}
                <button class="org-goto" type="button" data-buddy-id="${buddy.id}" aria-label="Go to ${displayName(buddy)} home page">Go to</button>
              </span>
            </div>
          </div>
          ${isExpanded ? `<ul role="group">${childMarkup}</ul>` : ""}
        </li>`;
    }

    function isDescendantOf(candidateId, ancestorId) {
      let current = buddies.find(buddy => buddy.id === candidateId);
      while (current && current.parent !== "—") {
        const parent = buddies.find(buddy => buddy.name === current.parent);
        if (!parent) return false;
        if (parent.id === ancestorId) return true;
        current = parent;
      }
      return false;
    }

    function canMoveUnder(sourceId, parentId) {
      const source = buddies.find(buddy => buddy.id === sourceId);
      const parent = buddies.find(buddy => buddy.id === parentId);
      return Boolean(source && parent && source.parent !== "—" && source.id !== parent.id && !isDescendantOf(parent.id, source.id));
    }

    function announceMove(message) {
      const status = document.getElementById("moveStatus");
      if (!status) return;
      status.textContent = message;
      clearTimeout(moveStatusTimer);
      moveStatusTimer = setTimeout(() => { if (status.isConnected) status.textContent = ""; }, 3200);
    }

    function moveBuddy(sourceId, parentId, beforeId) {
      if (!canMoveUnder(sourceId, parentId) || sourceId === beforeId) return false;
      const sourceIndex = buddies.findIndex(buddy => buddy.id === sourceId);
      const source = buddies[sourceIndex];
      const parent = buddies.find(buddy => buddy.id === parentId);
      buddies.splice(sourceIndex, 1);
      source.parent = parent.name;

      const siblings = childrenOf(parent).filter(buddy => buddy.id !== sourceId);
      let insertIndex;
      const beforeSibling = beforeId && siblings.find(buddy => buddy.id === beforeId);
      if (beforeSibling) {
        insertIndex = buddies.findIndex(buddy => buddy.id === beforeSibling.id);
      } else if (siblings.length) {
        insertIndex = buddies.findIndex(buddy => buddy.id === siblings[siblings.length - 1].id) + 1;
      } else {
        insertIndex = buddies.findIndex(buddy => buddy.id === parent.id) + 1;
      }
      buddies.splice(Math.max(0, insertIndex), 0, source);
      expandedOrg.add(parent.id);
      renderNav(search.value);
      renderOrgPanel();
      announceMove(`${displayName(source)} moved under ${displayName(parent)}.`);
      return true;
    }

    function clearOrgDragState() {
      page.querySelectorAll(".is-dragging, .is-drop-target").forEach(element => element.classList.remove("is-dragging", "is-drop-target"));
      const chart = page.querySelector(".org-chart");
      if (chart) chart.classList.remove("is-dragging");
    }

    function renderOrgPanel() {
      const panel = document.getElementById("orgPanel");
      if (!panel) return;
      panel.innerHTML = `<div class="org-chart" role="tree" aria-label="Interactive buddy organization chart"><ul>${hierarchyRoots().map(orgBranch).join("")}</ul></div>`;
      panel.querySelectorAll("[data-org-toggle]").forEach(button => {
        button.addEventListener("click", () => {
          if (dragJustEnded) return;
          const id = button.dataset.orgToggle;
          expandedOrg.has(id) ? expandedOrg.delete(id) : expandedOrg.add(id);
          renderOrgPanel();
          const nextButton = panel.querySelector(`[data-org-toggle="${id}"]`);
          if (nextButton) nextButton.focus();
        });
      });
      panel.querySelectorAll("[data-buddy-id]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          selectBuddy(button.dataset.buddyId, true);
        });
      });
      bindPreviewLinks(panel);
      panel.querySelectorAll(".org-node").forEach(node => {
        node.addEventListener("dragstart", event => {
          draggedBuddyId = node.dataset.orgNode;
          node.classList.add("is-dragging");
          panel.querySelector(".org-chart").classList.add("is-dragging");
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", draggedBuddyId);
        });
        node.addEventListener("dragover", event => {
          const targetId = node.dataset.orgNode;
          if (!canMoveUnder(draggedBuddyId, targetId)) return;
          event.preventDefault();
          event.stopPropagation();
          event.dataTransfer.dropEffect = "move";
          node.classList.add("is-drop-target");
        });
        node.addEventListener("dragleave", () => node.classList.remove("is-drop-target"));
        node.addEventListener("drop", event => {
          event.preventDefault();
          event.stopPropagation();
          const sourceId = draggedBuddyId || event.dataTransfer.getData("text/plain");
          const targetId = node.dataset.orgNode;
          clearOrgDragState();
          moveBuddy(sourceId, targetId, "");
        });
        node.addEventListener("dragend", () => {
          clearOrgDragState();
          draggedBuddyId = null;
          dragJustEnded = true;
          setTimeout(() => { dragJustEnded = false; }, 0);
        });
      });
      panel.querySelectorAll(".org-drop-slot").forEach(slot => {
        slot.addEventListener("dragover", event => {
          const parentId = slot.dataset.dropParent;
          if (!canMoveUnder(draggedBuddyId, parentId)) return;
          event.preventDefault();
          event.stopPropagation();
          event.dataTransfer.dropEffect = "move";
          slot.classList.add("is-drop-target");
        });
        slot.addEventListener("dragleave", () => slot.classList.remove("is-drop-target"));
        slot.addEventListener("drop", event => {
          event.preventDefault();
          event.stopPropagation();
          const sourceId = draggedBuddyId || event.dataTransfer.getData("text/plain");
          const parentId = slot.dataset.dropParent;
          const beforeId = slot.dataset.dropBefore;
          clearOrgDragState();
          moveBuddy(sourceId, parentId, beforeId);
        });
      });
    }

    function relationButton(buddy, label) {
      return buddy ? `<button class="detail-link" type="button" data-preview-id="${buddy.id}">${label || displayName(buddy)}</button>` : "";
    }

    function openBuddyDetail(id, trigger) {
      const buddy = buddies.find(item => item.id === id);
      const layer = document.getElementById("buddyDetailLayer");
      const body = document.getElementById("buddyDetailBody");
      if (!buddy || !layer || !body) return;
      const parent = buddies.find(item => item.name === buddy.parent);
      const children = childrenOf(buddy);
      const connected = (buddy.related || []).map(relatedId => buddies.find(item => item.id === relatedId)).filter(Boolean);
      detailReturnFocus = trigger || detailReturnFocus;
      body.innerHTML = `
        <div class="detail-top">
          <div class="detail-kicker"><span class="dot" style="--dot:${buddy.color};display:inline-block;margin-right:7px;"></span>${buddy.stage}</div>
          <button class="detail-close" id="detailClose" type="button" aria-label="Close details">×</button>
        </div>
        <h2 class="detail-title" id="detailTitle">${displayName(buddy)}</h2>
        ${buddy.alias ? `<div class="detail-canonical">${buddy.name}</div>` : ""}
        <p class="detail-summary">${buddy.summary}</p>
        <div class="detail-actions">
          <button class="detail-primary" type="button" data-detail-goto="${buddy.id}">Go to full page</button>
          ${buddy.brief ? `<a class="detail-link" href="${buddy.brief}" target="_blank" rel="noopener noreferrer">Open brief</a>` : ""}
        </div>
        <section class="detail-block" aria-labelledby="detailFactsHeading">
          <h3 id="detailFactsHeading">Key facts</h3>
          <div class="detail-facts">
            <div class="detail-fact"><div class="detail-fact-label">Owns</div><div class="detail-fact-value">${buddy.owns}</div></div>
            <div class="detail-fact"><div class="detail-fact-label">Source</div><div class="detail-fact-value">${sourceMarkup(buddy)}</div></div>
            <div class="detail-fact"><div class="detail-fact-label">Last shaped</div><div class="detail-fact-value">${buddy.updated}</div></div>
            <div class="detail-fact"><div class="detail-fact-label">Focus areas</div><div class="detail-fact-value">${buddy.focus.map(item => item[0]).join(" · ")}</div></div>
          </div>
        </section>
        <section class="detail-block" aria-labelledby="detailNextHeading">
          <h3 id="detailNextHeading">Next move</h3>
          <p class="detail-next">${buddy.next}</p>
        </section>
        <section class="detail-block" aria-labelledby="detailHierarchyHeading">
          <h3 id="detailHierarchyHeading">Place in the hierarchy</h3>
          <div class="detail-relations">
            ${parent ? relationButton(parent, `Parent · ${displayName(parent)}`) : '<span class="detail-empty">Top level</span>'}
            ${children.map(child => relationButton(child, `Child · ${displayName(child)}`)).join("")}
          </div>
        </section>
        <section class="detail-block" aria-labelledby="detailConnectedHeading">
          <h3 id="detailConnectedHeading">Connected buddies</h3>
          <div class="detail-relations">${connected.length ? connected.map(item => relationButton(item)).join("") : '<span class="detail-empty">No connected buddies yet.</span>'}</div>
        </section>`;
      layer.hidden = false;
      document.body.classList.add("detail-open");
      document.getElementById("detailClose").addEventListener("click", closeBuddyDetail);
      body.querySelector("[data-detail-goto]").addEventListener("click", event => selectBuddy(event.currentTarget.dataset.detailGoto, true));
      bindPreviewLinks(body);
      document.getElementById("detailTitle").focus?.();
      document.getElementById("detailClose").focus();
    }

    function closeBuddyDetail() {
      const layer = document.getElementById("buddyDetailLayer");
      if (!layer || layer.hidden) return;
      layer.hidden = true;
      document.body.classList.remove("detail-open");
      if (detailReturnFocus && detailReturnFocus.isConnected) detailReturnFocus.focus();
      detailReturnFocus = null;
    }

    function bindPreviewLinks(scope = page) {
      scope.querySelectorAll("[data-preview-id]").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          openBuddyDetail(button.dataset.previewId, button);
        });
      });
    }

    function bindDirectoryLinks() {
      page.querySelectorAll("[data-buddy-id]").forEach(button => {
        button.addEventListener("click", () => selectBuddy(button.dataset.buddyId, true));
      });
      bindPreviewLinks(page);
    }

    function applyDirectoryZoom(value) {
      directoryZoom = Math.min(160, Math.max(60, Number(value) || 100));
      const factor = directoryZoom / 100;
      page.querySelectorAll(".directory-panel").forEach(panel => {
        panel.style.zoom = String(factor);
        panel.style.width = `${100 / factor}%`;
      });
      const slider = document.getElementById("zoomSlider");
      const output = document.getElementById("zoomValue");
      if (slider) slider.value = String(directoryZoom);
      if (output) output.textContent = `${directoryZoom}%`;
    }

    function bindZoomControls() {
      const slider = document.getElementById("zoomSlider");
      const reset = document.getElementById("zoomReset");
      if (!slider || !reset) return;
      slider.addEventListener("input", event => applyDirectoryZoom(event.currentTarget.value));
      reset.addEventListener("click", () => {
        applyDirectoryZoom(100);
        slider.focus();
      });
      applyDirectoryZoom(directoryZoom);
    }

    function setDirectoryView(view) {
      directoryView = ["org", "tree", "outline"].includes(view) ? view : "org";
      page.querySelectorAll("[data-directory-view]").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.directoryView === directoryView));
      });
      const orgPanel = document.getElementById("orgPanel");
      const treePanel = document.getElementById("treePanel");
      const outlinePanel = document.getElementById("outlinePanel");
      if (orgPanel) orgPanel.hidden = directoryView !== "org";
      if (treePanel) treePanel.hidden = directoryView !== "tree";
      if (outlinePanel) outlinePanel.hidden = directoryView !== "outline";
      applyDirectoryZoom(directoryZoom);
    }

    function renderProjectHome(buddy) {
      const outlineRows = flattenHierarchy();
      page.innerHTML = `
        <header class="buddy-header">
          <div>
            <div class="eyebrow"><span class="dot" style="--dot:${buddy.color}"></span><span>Buddy system map</span></div>
            <h1>${displayName(buddy)}</h1>
            ${canonicalNameMarkup(buddy, "canonical-title")}
            <p class="summary">${buddy.summary}</p>
          </div>
          <div class="status-stamp"><span>Current stage</span><strong>${buddy.stage}</strong></div>
        </header>

        <section class="directory-home" aria-labelledby="directoryHeading">
          <div class="directory-toolbar">
            <div>
              <h2 id="directoryHeading" style="margin:0 0 4px;font-size:18px;">Buddy hierarchy</h2>
              <div class="directory-summary">${buddies.length} buddies · ${hierarchyDepth()} levels · generated from one registry</div>
            </div>
            <div class="view-switch" role="group" aria-label="Hierarchy view">
              <button class="view-btn" type="button" data-directory-view="org" aria-pressed="true">Org chart</button>
              <button class="view-btn" type="button" data-directory-view="tree" aria-pressed="false">Tree</button>
              <button class="view-btn" type="button" data-directory-view="outline" aria-pressed="false">Outline</button>
            </div>
          </div>

          <div class="directory-workspace">
            <div class="directory-viewport" id="directoryViewport">
              <div class="directory-panel" id="orgPanel"></div>

              <div class="directory-panel" id="treePanel" hidden>
                <ul class="hierarchy-tree" role="tree" aria-label="Buddy hierarchy tree">
                  ${hierarchyRoots().map(treeBranch).join("")}
                </ul>
              </div>

              <div class="directory-panel" id="outlinePanel" hidden>
                <div class="outline-list" role="list" aria-label="Buddy hierarchy outline">
                  ${outlineRows.map(({buddy: rowBuddy, depth}) => `
                    <button class="outline-row" type="button" role="listitem" data-preview-id="${rowBuddy.id}" style="--depth:${depth}" aria-label="${rowBuddy.alias ? `View details for ${rowBuddy.alias}, ${rowBuddy.name}` : `View details for ${rowBuddy.name}`}">
                      <span class="outline-name"><span class="dot" style="--dot:${rowBuddy.color}"></span><span class="outline-name-text"><span>${displayName(rowBuddy)}</span>${canonicalNameMarkup(rowBuddy, "outline-canonical")}</span></span>
                      <span class="outline-parent">${rowBuddy.parent === "—" ? "Top level" : `Child of ${rowBuddy.parent}`}</span>
                      <span class="outline-stage">${stageShort(rowBuddy.stage)}</span>
                    </button>`).join("")}
                </div>
              </div>
            </div>
            <aside class="zoom-dock" aria-label="Hierarchy zoom controls">
              <span class="zoom-label">Zoom</span>
              <input class="zoom-slider" id="zoomSlider" type="range" min="60" max="160" step="1" value="${directoryZoom}" orient="vertical" aria-label="Zoom level" aria-orientation="vertical" aria-describedby="zoomValue" />
              <output class="zoom-value" id="zoomValue" for="zoomSlider" aria-live="polite">${directoryZoom}%</output>
              <button class="zoom-reset" id="zoomReset" type="button" aria-label="Reset zoom to 100 percent" title="Reset zoom to 100%">100%</button>
            </aside>
          </div>
          <div class="move-status" id="moveStatus" role="status" aria-live="polite"></div>
          <p class="directory-note">Select any tile or row for a quick detail view without leaving the chart. In Org chart, use Expand or Collapse to reveal children, Go to for the full Buddy home page, or drag a tile onto another tile—or between siblings—to reorganize the hierarchy.</p>
        </section>

        <div class="detail-layer" id="buddyDetailLayer" hidden>
          <button class="detail-backdrop" id="detailBackdrop" type="button" aria-label="Close buddy details"></button>
          <aside class="detail-panel" id="buddyDetailBody" role="dialog" aria-modal="true" aria-labelledby="detailTitle"></aside>
        </div>`;

      page.querySelectorAll("[data-directory-view]").forEach(button => {
        button.addEventListener("click", () => setDirectoryView(button.dataset.directoryView));
      });
      document.getElementById("detailBackdrop").addEventListener("click", closeBuddyDetail);
      bindDirectoryLinks();
      renderOrgPanel();
      setDirectoryView(directoryView);
      bindZoomControls();
    }

    function bindCollapsibleSections() {
      page.querySelectorAll("[data-collapse-target]").forEach(button => {
        button.addEventListener("click", () => {
          const body = document.getElementById(button.dataset.collapseTarget);
          if (!body) return;
          const isOpen = button.getAttribute("aria-expanded") === "true";
          button.setAttribute("aria-expanded", String(!isOpen));
          body.hidden = isOpen;
        });
      });
    }

    function renderPage(buddy) {
      document.title = `${displayName(buddy)} · Project Buddy`;
      crumbName.textContent = displayName(buddy);
      if (buddy.id === "project-buddy") {
        renderProjectHome(buddy);
        window.scrollTo({top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
        return;
      }
      page.innerHTML = `
        <header class="buddy-header">
          <div>
            <div class="eyebrow"><span class="dot" style="--dot:${buddy.color}"></span><span>${buddy.parent === "—" ? "Top-level buddy" : `Child of ${buddy.parent}`}</span></div>
            <h1>${displayName(buddy)}</h1>
            ${canonicalNameMarkup(buddy, "canonical-title")}
            <p class="summary">${buddy.summary}</p>
          </div>
          <div class="status-stamp"><span>Current stage</span><strong>${buddy.stage}</strong></div>
        </header>

        <nav class="section-tabs" aria-label="On this page">
          <a href="#overview">Overview</a>
          <a href="#focus">What it owns</a>
          <a href="#next">Next</a>
          <a href="#related">Connected</a>
        </nav>

        <section id="overview" class="overview-section">
          <button class="collapsible-header" type="button" data-collapse-target="overviewBody" aria-expanded="true">
            <h2>Overview</h2><p>Parent, source, and the last time this Buddy was shaped.</p><span class="collapsible-chevron" aria-hidden="true">›</span>
          </button>
          <div class="collapsible-body" id="overviewBody">
            <div class="overview-grid" aria-label="Buddy overview">
              <div class="fact"><div class="fact-label">Parent</div><div class="fact-value">${buddy.parent}</div></div>
              <div class="fact"><div class="fact-label">Source</div><div class="fact-value">${sourceMarkup(buddy)}</div></div>
              <div class="fact"><div class="fact-label">Last shaped</div><div class="fact-value">${buddy.updated}</div></div>
            </div>
          </div>
        </section>

        <section id="focus" class="page-section">
          <button class="collapsible-header" type="button" data-collapse-target="focusBody" aria-expanded="true">
            <h2>What it owns</h2><p>${buddy.owns}</p><span class="collapsible-chevron" aria-hidden="true">›</span>
          </button>
          <div class="collapsible-body" id="focusBody">
            <div class="focus-list">
              ${buddy.focus.map((item, index) => `<div class="focus-item"><div class="focus-number">0${index + 1}</div><div><h3>${item[0]}</h3><p>${item[1]}</p></div></div>`).join("")}
            </div>
          </div>
        </section>

        <section id="next" class="page-section">
          <button class="collapsible-header" type="button" data-collapse-target="nextBody" aria-expanded="true">
            <h2>Next move</h2><p>The clearest current step, kept deliberately singular.</p><span class="collapsible-chevron" aria-hidden="true">›</span>
          </button>
          <div class="collapsible-body" id="nextBody">
            <div class="next-card"><div class="next-accent"></div><div class="next-body"><span>Recommended next</span><p>${buddy.next}</p></div></div>
          </div>
        </section>

        <section id="related" class="page-section">
          <button class="collapsible-header" type="button" data-collapse-target="relatedBody" aria-expanded="true">
            <h2>Connected buddies</h2><p>Move sideways without going back to the full directory.</p><span class="collapsible-chevron" aria-hidden="true">›</span>
          </button>
          <div class="collapsible-body" id="relatedBody">
            <div class="related-wrap">${relatedButtons(buddy.related)}</div>
          </div>
        </section>
      `;
      bindCollapsibleSections();
      page.querySelectorAll("[data-related]").forEach(btn => btn.addEventListener("click", () => selectBuddy(btn.dataset.related, true)));
      window.scrollTo({top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
    }

    function selectBuddy(id, updateHash) {
      const buddy = buddies.find(b => b.id === id) || buddies[0];
      document.body.classList.remove("detail-open");
      detailReturnFocus = null;
      activeId = buddy.id;
      renderNav(search.value);
      renderPage(buddy);
      if (updateHash && location.hash !== `#${buddy.id}`) history.pushState({buddy: buddy.id}, "", `#${buddy.id}`);
      closeMenu();
    }

    function openMenu() {
      document.body.classList.add("menu-open");
      menuButton.setAttribute("aria-expanded", "true");
      setTimeout(() => search.focus(), 30);
    }
    function closeMenu() {
      document.body.classList.remove("menu-open");
      menuButton.setAttribute("aria-expanded", "false");
    }

    search.addEventListener("input", e => renderNav(e.target.value));
    menuButton.addEventListener("click", () => document.body.classList.contains("menu-open") ? closeMenu() : openMenu());
    scrim.addEventListener("click", closeMenu);
    document.addEventListener("keydown", e => {
      if (e.key !== "Escape") return;
      if (document.body.classList.contains("detail-open")) closeBuddyDetail();
      else closeMenu();
    });
    window.addEventListener("popstate", () => selectBuddy(location.hash.slice(1), false));

    const initialId = location.hash.slice(1);
    selectBuddy(buddies.some(b => b.id === initialId) ? initialId : "project-buddy", false);
  </script>
</body>
</html>
